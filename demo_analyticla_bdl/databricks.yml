# This is a Declarative Automation Bundle definition for demo_analyticla_bdl.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: demo_analyticla_bdl
  uuid: e87dcae1-d53a-4f69-823c-72c890e709da

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    # mode: development
    presets:
      name_prefix: dev_
    default: true
    workspace:
      host: https://dbc-5a7e1d53-7590.cloud.databricks.com
    variables:
      catalog: dev_catl
      schema: dev
  prod:
    mode: production
    presets:
      name_prefix: prod_
    workspace:
      host: https://dbc-5a7e1d53-7590.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/tsudheernadh5@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/tsudheernadh5@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: prod_catl
      schema: prod
    permissions:
      - user_name: tsudheernadh5@gmail.com
        level: CAN_MANAGE
